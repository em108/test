name: Build Vite App for Android Gemini

on:
  workflow_call:
    inputs:
      repository:
        description: Repository to clone and build
        type: string
        required: true
      ref:
        description: Branch/tag/ref to build
        type: string
        required: true
      app_name:
        description: App name for the Android build
        type: string
        default: "MyApp"
      bundle_id:
        description: Bundle identifier (e.g., com.example.myapp)
        type: string
        default: "com.example.myapp"
    secrets:
      WF_TOKEN:
        description: GitHub token for private repos
        required: false
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to clone and build
        type: string
        required: true
      ref:
        description: Branch/tag/ref to build
        type: string
        default: main
      app_name:
        description: App name for the Android build
        type: string
        default: "MyApp"
      bundle_id:
        description: Bundle identifier (e.g., com.example.myapp)
        type: string
        default: "com.example.myapp"

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout self
        uses: actions/checkout@v4

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.WF_TOKEN || github.token }}
          path: app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components and set NDK_HOME
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;33.0.0" "ndk;25.2.9519653"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV
        
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        working-directory: app
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "yarn.lock" ]; then
            yarn install --frozen-lockfile
          elif [ -f "pnpm-lock.yaml" ]; then
            npm install -g pnpm
            pnpm install --frozen-lockfile
          elif [ -f "bun.lockb" ]; then
            npm install -g bun
            bun install
          else
            npm install
          fi

      - name: Check if Tauri is already initialized
        id: check_tauri
        working-directory: app
        run: |
          if [ -f "src-tauri/tauri.conf.json" ]; then
            echo "tauri_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tauri_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Install Tauri CLI & API
        if: steps.check_tauri.outputs.tauri_exists == 'false'
        working-directory: app
        run: |
          npm install --save-dev @tauri-apps/cli@latest
          npm install @tauri-apps/api@latest

      - name: Initialize Tauri if needed
        if: steps.check_tauri.outputs.tauri_exists == 'false'
        working-directory: app
        run: |
          npx tauri init --ci \
            --app-name "${{ inputs.app_name }}" \
            --window-title "${{ inputs.app_name }}" \
            --frontend-dist "dist" \
            --dev-url "http://localhost:5173"

      # This step fixes a potential cache error if src-tauri doesn't exist yet
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        if: steps.check_tauri.outputs.tauri_exists == 'true'
        with:
          workspaces: "app/src-tauri -> target"

      - name: Update Tauri configuration
        working-directory: app
        run: |
          # Use jq for reliable JSON editing
          sudo apt-get update && sudo apt-get install -y jq

          # Update tauri.conf.json
          jq '.tauri.bundle.identifier = "${{ inputs.bundle_id }}"' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          jq '.tauri.productName = "${{ inputs.app_name }}"' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          jq '.build.distDir = "../dist"' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          
          # Update package name in Cargo.toml
          CARGO_PKG_NAME=$(echo "${{ inputs.app_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          sed -i 's/^name = .*/name = "'"$CARGO_PKG_NAME"'"/' src-tauri/Cargo.toml

          echo "--- Updated tauri.conf.json ---"
          cat src-tauri/tauri.conf.json
          echo "--- Updated Cargo.toml ---"
          cat src-tauri/Cargo.toml

      - name: Build frontend
        working-directory: app
        run: |
          if [ -f package.json ] && grep -q '"build"' package.json; then
              npm run build
          else
              echo "No build script found, trying vite build directly"
              npx vite build
          fi

      - name: Create Android keystore
        working-directory: app
        run: |
          keytool -genkey -v \
            -keystore android-keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias android-key \
            -dname "CN=GitHub Actions, OU=CI, O=GitHub, L=San Francisco, ST=California, C=US" \
            -storepass password \
            -keypass password

      - name: Build Android APK
        working-directory: app
        run: |
          # Set up signing configuration just before build
          # This assumes `tauri android init` or `tauri android build` will create the gen/android directory
          export TAURI_SIGNING_PRIVATE_KEY_PATH="android-keystore.jks"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="password"
          
          # Build the APK. This will also run `tauri android init` if needed.
          npx tauri android build --apk

      - name: Find and Rename APK
        id: find_apk
        working-directory: app
        run: |
          APK_PATH=$(find src-tauri/gen/android -name "*-release.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found!"
            exit 1
          fi
          
          NEW_NAME="${{ inputs.app_name }}-${{ github.sha }}.apk"
          # Move to the root of the 'app' directory for easier artifact pathing
          mv "$APK_PATH" "$NEW_NAME"
          
          echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "APK found and renamed to: $NEW_NAME"
          
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/${{ steps.find_apk.outputs.apk_path }}
          retention-days: 2

      - name: Upload debug info on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-debug-info
          path: |
            app/src-tauri/gen/android/app/build/outputs/logs/
            app/src-tauri/target/
          retention-days: 1
