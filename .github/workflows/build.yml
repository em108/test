name: Build Claudia

on:
  workflow_call:
    inputs:
      repository:
        description: Repository to clone and build
        type: string
        default: getAsterisk/claudia
      ref:
        description: Branch/tag/ref to build
        type: string
        required: true
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to clone and build
        type: string
        default: getAsterisk/claudia
      ref:
        description: Branch/tag/ref to build
        type: string
        default: main

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc]
        include:
          - target: x86_64-pc-windows-msvc
            artifact_name: claudia-windows-x64

    steps:
      - name: Enable long paths in Git
        run: |
          git config --system core.longpaths true

      - name: Enable long paths in Windows
        shell: powershell
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      - name: Checkout self
        uses: actions/checkout@v4

      - name: Checkout Claudia
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: claudia

      - name: Install WebView2
        shell: powershell
        run: |
          # Download and install WebView2 Runtime
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "MicrosoftEdgeWebview2Setup.exe"
          Start-Process -FilePath "MicrosoftEdgeWebview2Setup.exe" -ArgumentList "/silent", "/install" -Wait

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Bun
        shell: powershell
        run: |
          irm bun.sh/install.ps1 | iex

      - name: Add Bun to PATH
        shell: powershell
        run: |
          $bunPath = "$env:USERPROFILE\.bun\bin"
          echo "$bunPath" >> $env:GITHUB_PATH

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "claudia/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: claudia
        shell: powershell
        run: |
          bun install

      - name: Generate missing icons
        working-directory: claudia
        shell: powershell
        run: |
          # Create icons directory if it doesn't exist
          if (!(Test-Path "src-tauri\icons")) {
            New-Item -ItemType Directory -Path "src-tauri\icons" -Force
          }
          
          # Check if icon.ico exists, if not, create a simple one or use Tauri's icon generation
          if (!(Test-Path "src-tauri\icons\icon.ico")) {
            Write-Host "icon.ico not found, generating icons..."
            
            # Check if there's a PNG icon we can use as source
            $pngIcon = Get-ChildItem "src-tauri\icons\*.png" | Select-Object -First 1
            
            if ($pngIcon) {
              Write-Host "Found PNG icon: $($pngIcon.Name), using it as source"
              # Use Tauri's icon generation
              bun run tauri icon "$($pngIcon.FullName)"
            } else {
              Write-Host "No PNG icon found, creating a default icon..."
              # Create a simple default icon using PowerShell and .NET
              Add-Type -AssemblyName System.Drawing
              
              # Create a simple 32x32 icon
              $bitmap = New-Object System.Drawing.Bitmap(32, 32)
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              $graphics.FillRectangle([System.Drawing.Brushes]::Blue, 0, 0, 32, 32)
              $graphics.FillRectangle([System.Drawing.Brushes]::White, 8, 8, 16, 16)
              $graphics.Dispose()
              
              # Save as PNG first
              $bitmap.Save("src-tauri\icons\icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
              $bitmap.Dispose()
              
              # Now generate all icon formats from this PNG
              bun run tauri icon "src-tauri\icons\icon.png"
            }
          }
          
          # Verify the icon was created
          if (Test-Path "src-tauri\icons\icon.ico") {
            Write-Host "icon.ico successfully created/found"
          } else {
            Write-Host "Warning: icon.ico still not found"
          }

      - name: Build Tauri application
        working-directory: claudia
        shell: powershell
        env:
          RUST_BACKTRACE: 1
        run: |
          bun run tauri build --target ${{ matrix.target }}

      - name: Archive executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-exe
          path: claudia/src-tauri/target/${{ matrix.target }}/release/claudia.exe

      - name: Archive MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-msi
          path: claudia/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

      - name: Archive NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-nsis
          path: claudia/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
