name: Build Claudia

on:
  workflow_call:
    inputs:
      repository:
        description: Repository to clone and build
        type: string
        default: getAsterisk/claudia
      ref:
        description: Branch/tag/ref to build
        type: string
        required: true
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to clone and build
        type: string
        default: getAsterisk/claudia
      ref:
        description: Branch/tag/ref to build
        type: string
        default: main

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc]
        include:
          - target: x86_64-pc-windows-msvc
            artifact_name: claudia-windows-x64

    steps:
      - name: Enable long paths in Git
        run: |
          git config --system core.longpaths true

      - name: Enable long paths in Windows
        shell: powershell
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      - name: Checkout self
        uses: actions/checkout@v4

      - name: Checkout Claudia
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: claudia

      - name: Install WebView2
        shell: powershell
        run: |
          # Download and install WebView2 Runtime
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "MicrosoftEdgeWebview2Setup.exe"
          Start-Process -FilePath "MicrosoftEdgeWebview2Setup.exe" -ArgumentList "/silent", "/install" -Wait

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Bun
        shell: powershell
        run: |
          irm bun.sh/install.ps1 | iex

      - name: Add Bun to PATH
        shell: powershell
        run: |
          $bunPath = "$env:USERPROFILE\.bun\bin"
          echo "$bunPath" >> $env:GITHUB_PATH

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "claudia/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: claudia
        shell: powershell
        run: |
          bun install

      - name: Fix icon format issue
        working-directory: claudia
        shell: powershell
        run: |
          # Install ImageMagick for proper icon conversion
          Write-Host "Installing ImageMagick..."
          choco install imagemagick -y
          
          # Create icons directory if it doesn't exist
          if (!(Test-Path "src-tauri\icons")) {
            New-Item -ItemType Directory -Path "src-tauri\icons" -Force
          }
          
          # Remove any existing problematic icon files
          if (Test-Path "src-tauri\icons\icon.ico") {
            Write-Host "Removing existing icon.ico..."
            Remove-Item "src-tauri\icons\icon.ico" -Force
          }
          
          # Check if there's a PNG icon we can use as source
          $pngIcon = Get-ChildItem "src-tauri\icons\*.png" | Select-Object -First 1
          
          if ($pngIcon) {
            Write-Host "Found PNG icon: $($pngIcon.Name), using it as source"
            $sourcePng = $pngIcon.FullName
          } else {
            Write-Host "No PNG icon found, creating a default one..."
            # Create a simple default icon using PowerShell and .NET
            Add-Type -AssemblyName System.Drawing
            
            # Create a simple 1024x1024 icon for better quality
            $bitmap = New-Object System.Drawing.Bitmap(1024, 1024)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.FillRectangle([System.Drawing.Brushes]::DodgerBlue, 0, 0, 1024, 1024)
            $graphics.FillRectangle([System.Drawing.Brushes]::White, 256, 256, 512, 512)
            $graphics.Dispose()
            
            # Save as PNG
            $sourcePng = "src-tauri\icons\source.png"
            $bitmap.Save($sourcePng, [System.Drawing.Imaging.ImageFormat]::Png)
            $bitmap.Dispose()
            Write-Host "Created default PNG icon at: $sourcePng"
          }
          
          # Use ImageMagick to create a proper ICO file with multiple sizes
          Write-Host "Converting PNG to ICO format using ImageMagick..."
          $iconPath = "src-tauri\icons\icon.ico"
          
          # Create ICO with multiple sizes (16x16, 32x32, 48x48, 256x256)
          & magick convert "$sourcePng" -resize 256x256 -resize 48x48 -resize 32x32 -resize 16x16 "$iconPath"
          
          # Verify the icon was created and is valid
          if (Test-Path $iconPath) {
            $iconSize = (Get-Item $iconPath).Length
            Write-Host "ICO file created successfully. Size: $iconSize bytes"
            
            # Additional verification - try to read the file
            try {
              $iconBytes = [System.IO.File]::ReadAllBytes($iconPath)
              if ($iconBytes.Length -gt 0 -and $iconBytes[0] -eq 0x00 -and $iconBytes[1] -eq 0x00) {
                Write-Host "ICO file format verification passed"
              } else {
                Write-Host "Warning: ICO file may have format issues"
              }
            } catch {
              Write-Host "Warning: Could not verify ICO file format"
            }
          } else {
            Write-Host "Error: ICO file was not created"
            exit 1
          }

      - name: Build Tauri application
        working-directory: claudia
        shell: powershell
        env:
          RUST_BACKTRACE: 1
        run: |
          bun run tauri build --target ${{ matrix.target }}

      - name: Archive executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-exe
          path: claudia/src-tauri/target/${{ matrix.target }}/release/claudia.exe

      - name: Archive MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-msi
          path: claudia/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

      - name: Archive NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-nsis
          path: claudia/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
