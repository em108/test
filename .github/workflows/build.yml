name: Build Claudia

on:
  workflow_call:
    inputs:
      repository:
        description: Repository to clone and build
        type: string
        default: getAsterisk/claudia
      ref:
        description: Branch/tag/ref to build
        type: string
        required: true
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to clone and build
        type: string
        default: getAsterisk/claudia
      ref:
        description: Branch/tag/ref to build
        type: string
        default: main

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc]
        include:
          - target: x86_64-pc-windows-msvc
            artifact_name: claudia-windows-x64

    steps:
      - name: Enable long paths in Git
        run: git config --system core.longpaths true

      - name: Enable long paths in Windows
        shell: powershell
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      - name: Checkout self
        uses: actions/checkout@v4

      - name: Checkout Claudia
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: claudia

      - name: Install WebView2
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "MicrosoftEdgeWebview2Setup.exe"
          Start-Process -FilePath "MicrosoftEdgeWebview2Setup.exe" -ArgumentList "/silent", "/install" -Wait

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "claudia/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: claudia
        run: bun install

      # --- START: ICON FIX ---
      # The icon.ico in the repository is not in a valid format for the Windows Resource Compiler.
      # This step generates a new, valid .ico file from the source icon.png.
      - name: Generate a valid Windows icon
        working-directory: claudia
        shell: powershell
        run: |
          Write-Host "Installing ImageMagick to create a valid .ico file..."
          choco install imagemagick -y
          
          $sourcePng = "src-tauri/icons/icon.png"
          $outputIco = "src-tauri/icons/icon.ico"
          
          Write-Host "Converting $sourcePng to a valid multi-resolution $outputIco..."
          # This command creates a proper .ico file with multiple sizes for best results
          & magick convert $sourcePng -define icon:auto-resize=16,32,48,64,256 $outputIco
          
          if (Test-Path $outputIco) {
            Write-Host "Successfully generated valid icon.ico file."
          } else {
            Write-Error "Failed to generate icon.ico file."
            exit 1
          }
      # --- END: ICON FIX ---

      # --- START: CONFIG FIX ---
      # This step ensures the tauri.conf.json includes the .ico file for the Windows bundler.
      - name: Update tauri.conf.json for Windows build
        working-directory: claudia
        shell: powershell
        run: |
          $configFile = "src-tauri/tauri.conf.json"
          $config = Get-Content -Path $configFile -Raw | ConvertFrom-Json
          if ($config.bundle.icon -notcontains "icons/icon.ico") {
            Write-Host "Adding 'icons/icon.ico' to the bundle icon list."
            $config.bundle.icon += "icons/icon.ico"
          }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Path $configFile
          Write-Host "Successfully updated $configFile."
      # --- END: CONFIG FIX ---

      - name: Build Tauri application
        working-directory: claudia
        env:
          RUST_BACKTRACE: 1
        run: bun run tauri build --target ${{ matrix.target }}

      - name: Archive executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-exe
          path: claudia/src-tauri/target/${{ matrix.target }}/release/claudia.exe

      - name: Archive MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-msi
          path: claudia/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

      - name: Archive NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-nsis
          path: claudia/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
