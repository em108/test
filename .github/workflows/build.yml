name: Build Claudia

on:
  workflow_call:
    inputs:
      repository:
        description: Repository to clone and build
        type: string
        default: getAsterisk/claudia
      ref:
        description: Branch/tag/ref to build
        type: string
        required: true
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to clone and build
        type: string
        default: getAsterisk/claudia
      ref:
        description: Branch/tag/ref to build
        type: string
        default: main

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc]
        include:
          - target: x86_64-pc-windows-msvc
            artifact_name: claudia-windows-x64

    steps:
      - name: Enable long paths in Git
        run: git config --system core.longpaths true

      - name: Enable long paths in Windows
        shell: powershell
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      - name: Checkout self
        uses: actions/checkout@v4

      - name: Checkout Claudia
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: claudia

      - name: Install WebView2
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "MicrosoftEdgeWebview2Setup.exe"
          Start-Process -FilePath "MicrosoftEdgeWebview2Setup.exe" -ArgumentList "/silent", "/install" -Wait

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "claudia/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: claudia
        run: bun install

      # --- START: THE FIX ---
      # The original "Fix icon format issue" step was incorrect.
      # This new step correctly modifies the tauri.conf.json in the runner
      # to include the required .ico file for the Windows build.
      - name: Update tauri.conf.json for Windows build
        working-directory: claudia
        shell: powershell
        run: |
          $configFile = "src-tauri/tauri.conf.json"
          Write-Host "Reading configuration from $configFile"
          
          # Read the JSON file and convert it to a PowerShell object
          $config = Get-Content -Path $configFile -Raw | ConvertFrom-Json
          
          # Add the required icon file to the icon array if it doesn't already exist
          if ($config.bundle.icon -notcontains "icons/icon.ico") {
            Write-Host "Adding 'icons/icon.ico' to the bundle icon list."
            $config.bundle.icon += "icons/icon.ico"
          } else {
            Write-Host "'icons/icon.ico' is already present. No changes needed."
          }
          
          # Convert the object back to a JSON string and save it.
          # Using -Depth 5 is a safe choice for nested config files.
          $config | ConvertTo-Json -Depth 5 | Set-Content -Path $configFile
          
          Write-Host "Successfully updated $configFile. New content:"
          Get-Content $configFile
      # --- END: THE FIX ---

      - name: Build Tauri application
        working-directory: claudia
        env:
          RUST_BACKTRACE: 1
        run: bun run tauri build --target ${{ matrix.target }}

      - name: Archive executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-exe
          path: claudia/src-tauri/target/${{ matrix.target }}/release/claudia.exe

      - name: Archive MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-msi
          path: claudia/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

      - name: Archive NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-nsis
          path: claudia/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
