# This workflow builds a Tauri v2 application for Android with PROPER signing integration
name: Build Android App with Production Signing (Fixed)

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to clone and build (e.g., "my-org/my-app")'
        type: string
        required: true
      ref:
        description: 'Branch, tag, or ref to build (e.g., "main")'
        type: string
        required: true
      app_name:
        description: 'App name for the Android build (e.g., "MyApp")'
        type: string
        default: "MyApp"
      bundle_id:
        description: 'Bundle identifier (e.g., "com.example.myapp")'
        type: string
        default: "com.example.myapp"
    secrets:
      WF_TOKEN:
        description: 'GitHub token with access to private repositories, if needed.'
        required: false
      ANDROID_KEYSTORE_B64:
        description: 'Base64 encoded content of the release keystore file.'
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        description: 'The password for the release keystore.'
        required: true
      ANDROID_KEY_ALIAS:
        description: 'The alias of the key within the keystore.'
        required: true

  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository to clone and build (e.g., "my-org/my-app")'
        type: string
        required: true
      ref:
        description: 'Branch, tag, or ref to build (e.g., "main")'
        type: string
        default: main
      app_name:
        description: 'App name for the Android build (e.g., "MyApp")'
        type: string
        default: "MyApp"
      bundle_id:
        description: 'Bundle identifier (e.g., "com.example.myapp")'
        type: string
        default: "com.example.myapp"

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout self (workflow repository)
        uses: actions/checkout@v4

      - name: Checkout target repository (application code)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.WF_TOKEN || github.token }}
          path: app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Java (for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components and set NDK_HOME
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;33.0.0" "ndk;25.2.9519653"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV
        
      - name: Install Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        working-directory: app
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi

      - name: Initialize Tauri if not present
        working-directory: app
        run: |
          if [ ! -f "src-tauri/tauri.conf.json" ]; then
            npm install --save-dev @tauri-apps/cli@latest @tauri-apps/api@latest
            npx tauri init --ci --app-name "${{ inputs.app_name }}" --window-title "${{ inputs.app_name }}" --frontend-dist "dist" --dev-url "http://localhost:5173"
          fi

      - name: Add tauri script to package.json
        working-directory: app
        run: npm pkg set "scripts.tauri"="tauri"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: Update Tauri configuration for Android (Tauri v2 Schema)
        working-directory: app
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          jq '
            .productName = "${{ inputs.app_name }}" |
            .identifier = "${{ inputs.bundle_id }}" |
            .build.frontendDist = "../dist" |
            .bundle.android.minSdkVersion = 24
          ' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          
          CARGO_PKG_NAME=$(echo "${{ inputs.app_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          sed -i 's/^name = .*/name = "'"$CARGO_PKG_NAME"'"/' src-tauri/Cargo.toml
          
      - name: Build frontend
        working-directory: app
        run: |
          if [ -f package.json ] && grep -q '"build"' package.json; then
              npm run build
          else
              echo "No build script found, trying vite build directly"
              npx vite build
          fi

      - name: Initialize Android project and configure signing
        working-directory: app
        run: |
          # 1. Initialize the Android project
          npx tauri android init

          # 2. Create keystore file
          base64 --decode <<< "${{ secrets.ANDROID_KEYSTORE_B64 }}" > $RUNNER_TEMP/keystore.jks
          
          # 3. Create keystore.properties file in the android directory
          cd src-tauri/gen/android
          echo "Creating keystore.properties file..."
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
          
          echo "Contents of keystore.properties:"
          cat keystore.properties
          
          # 4. Modify the app-level build.gradle to include signing configuration
          echo "Modifying app/build.gradle to include signing configuration..."
          
          # First, let's see what build.gradle looks like
          echo "=== ORIGINAL BUILD.GRADLE ==="
          cat app/build.gradle
          echo "=== END ORIGINAL BUILD.GRADLE ==="
          
          # Create a backup
          cp app/build.gradle app/build.gradle.backup
          
          # Add signing configuration to build.gradle
          cat > app/build.gradle << 'EOF'
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'rust'
}

// Load keystore.properties
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdk 33

    defaultConfig {
        applicationId "PLACEHOLDER_APP_ID"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            if (keystoreProperties['keyAlias'] != null) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            isMinifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            isMinifyEnabled = false
            isJniDebuggable = true
            isDebuggable = true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.4.0'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

rust {
    rootDirRel = "../../../"
}

dependencies {
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
    implementation "androidx.compose.material3:material3:1.1.0-beta02"
    implementation "androidx.compose.material:material:$compose_version"
    implementation "androidx.activity:activity-compose:1.6.1"
    implementation "androidx.core:core-ktx:1.9.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_version"
}
EOF

          # Replace the placeholder with actual bundle ID
          sed -i 's/PLACEHOLDER_APP_ID/${{ inputs.bundle_id }}/g' app/build.gradle
          
          echo "=== MODIFIED BUILD.GRADLE ==="
          cat app/build.gradle
          echo "=== END MODIFIED BUILD.GRADLE ==="

      - name: Build signed Android APK
        working-directory: app
        run: |
          echo "Building signed APK..."
          cd src-tauri/gen/android
          
          # Build the release APK directly with Gradle
          ./gradlew assembleRelease --stacktrace
          
          echo "Build completed. Checking outputs..."
          ls -la app/build/outputs/apk/universal/release/

      - name: Verify APK signature and find signed APK
        id: find_apk
        working-directory: app
        run: |
          echo "=== SEARCHING FOR ALL APK FILES ==="
          find src-tauri/gen/android -name "*.apk" -type f | while read apk; do
            echo "Found APK: $apk"
            echo "  Size: $(ls -lh "$apk" | awk '{print $5}')"
            
            # Check APK signature using jarsigner
            if command -v jarsigner &> /dev/null; then
              echo "  Signature verification:"
              if jarsigner -verify "$apk" 2>/dev/null; then
                echo "    ✅ APK is SIGNED"
              else
                echo "    ❌ APK is unsigned"
              fi
            fi
            echo "  ---"
          done
          
          # Find the signed APK (should not have "unsigned" in the name)
          APK_PATH=$(find src-tauri/gen/android -name "*release.apk" ! -name "*unsigned*" | head -1)
          
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No signed APK found!"
            echo "Available APK files:"
            find src-tauri/gen/android -name "*.apk" -type f
            exit 1
          fi
          
          echo "Selected signed APK: $APK_PATH"
          
          # Verify it's actually signed
          if jarsigner -verify "$APK_PATH" 2>/dev/null; then
            echo "✅ Confirmed: APK is properly signed"
          else
            echo "❌ Warning: APK may not be properly signed"
          fi
          
          SANITIZED_APP_NAME=$(echo "${{ inputs.app_name }}" | sed 's/[^a-zA-Z0-9._-]//g')
          COMMIT_HASH=$(git rev-parse --short HEAD)
          NEW_NAME="${SANITIZED_APP_NAME}-${COMMIT_HASH}-signed.apk"
          
          echo "Moving '$APK_PATH' to '$NEW_NAME'"
          mv "$APK_PATH" "$NEW_NAME"
          
          echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT
          
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-android-apk-${{ github.run_id }}
          path: app/${{ steps.find_apk.outputs.apk_path }}
          retention-days: 7

      - name: Upload debug info on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-debug-info-${{ github.run_id }}
          path: |
            app/src-tauri/gen/android/app/build/outputs/logs/
            app/src-tauri/gen/android/keystore.properties
            app/src-tauri/gen/android/app/build.gradle
            app/src-tauri/gen/android/app/build.gradle.backup
          retention-days: 1
