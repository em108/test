# This workflow builds a Tauri v2 application for Android using a permanent, secure signing key.
# Enhanced version that uploads all APK files for debugging
name: Build Android App with Production Signing (Debug All APKs)

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to clone and build (e.g., "my-org/my-app")'
        type: string
        required: true
      ref:
        description: 'Branch, tag, or ref to build (e.g., "main")'
        type: string
        required: true
      app_name:
        description: 'App name for the Android build (e.g., "MyApp")'
        type: string
        default: "MyApp"
      bundle_id:
        description: 'Bundle identifier (e.g., "com.example.myapp")'
        type: string
        default: "com.example.myapp"
    secrets:
      WF_TOKEN:
        description: 'GitHub token with access to private repositories, if needed.'
        required: false
      ANDROID_KEYSTORE_B64:
        description: 'Base64 encoded content of the release keystore file.'
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        description: 'The password for the release keystore.'
        required: true
      ANDROID_KEY_ALIAS:
        description: 'The alias of the key within the keystore.'
        required: true

  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository to clone and build (e.g., "my-org/my-app")'
        type: string
        required: true
      ref:
        description: 'Branch, tag, or ref to build (e.g., "main")'
        type: string
        default: main
      app_name:
        description: 'App name for the Android build (e.g., "MyApp")'
        type: string
        default: "MyApp"
      bundle_id:
        description: 'Bundle identifier (e.g., "com.example.myapp")'
        type: string
        default: "com.example.myapp"

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout self (workflow repository)
        uses: actions/checkout@v4

      - name: Checkout target repository (application code)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.WF_TOKEN || github.token }}
          path: app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Java (for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components and set NDK_HOME
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;33.0.0" "ndk;25.2.9519653"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV
        
      - name: Install Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        working-directory: app
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi

      - name: Initialize Tauri if not present
        working-directory: app
        run: |
          if [ ! -f "src-tauri/tauri.conf.json" ]; then
            npm install --save-dev @tauri-apps/cli@latest @tauri-apps/api@latest
            npx tauri init --ci --app-name "${{ inputs.app_name }}" --window-title "${{ inputs.app_name }}" --frontend-dist "dist" --dev-url "http://localhost:5173"
          fi

      - name: Add tauri script to package.json
        working-directory: app
        run: npm pkg set "scripts.tauri"="tauri"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: Update Tauri configuration for Android (Tauri v2 Schema)
        working-directory: app
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          jq '
            .productName = "${{ inputs.app_name }}" |
            .identifier = "${{ inputs.bundle_id }}" |
            .build.frontendDist = "../dist" |
            .bundle.android.minSdkVersion = 24
          ' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          
          CARGO_PKG_NAME=$(echo "${{ inputs.app_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          sed -i 's/^name = .*/name = "'"$CARGO_PKG_NAME"'"/' src-tauri/Cargo.toml
          
      - name: Build frontend
        working-directory: app
        run: |
          if [ -f package.json ] && grep -q '"build"' package.json; then
              npm run build
          else
              echo "No build script found, trying vite build directly"
              npx vite build
          fi

      - name: Build and Sign Android APK via keystore.properties
        working-directory: app
        run: |
          # 1. Initialize the Android project to generate the Gradle files.
          npx tauri android init

          # 2. Go into the generated Android directory.
          cd src-tauri/gen/android

          # 3. Create the keystore.properties file that Gradle will use for signing.
          echo "Creating keystore.properties file..."
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> keystore.properties

          # 4. Decode the Base64 keystore into a temporary file and reference it.
          base64 --decode <<< "${{ secrets.ANDROID_KEYSTORE_B64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
          
          # 5. Verify keystore.properties was created correctly
          echo "Contents of keystore.properties:"
          cat keystore.properties
          
          # 6. Go back to the app root.
          cd ../../..

          # 7. Build the APK. Gradle will now automatically find and use the signing config.
          echo "Starting Tauri Android build..."
          npx tauri android build --apk

      - name: Debug - List all APK files and their properties
        working-directory: app
        run: |
          echo "=== SEARCHING FOR ALL APK FILES ==="
          find src-tauri/gen/android -name "*.apk" -type f | while read apk; do
            echo "Found APK: $apk"
            echo "  Size: $(ls -lh "$apk" | awk '{print $5}')"
            echo "  Modified: $(ls -l "$apk" | awk '{print $6, $7, $8}')"
            
            # Check if APK is signed using aapt2 (if available) or basic file info
            if command -v aapt2 &> /dev/null; then
              echo "  Package info:"
              aapt2 dump badging "$apk" | head -5 || echo "  Could not extract package info"
            fi
            
            # Check APK signature using jarsigner
            if command -v jarsigner &> /dev/null; then
              echo "  Signature verification:"
              jarsigner -verify -verbose "$apk" | head -10 || echo "  Could not verify signature"
            fi
            echo "  ---"
          done
          
          echo "=== DIRECTORY STRUCTURE ==="
          ls -laR src-tauri/gen/android/app/build/outputs/

      - name: Upload ALL APK files for inspection
        uses: actions/upload-artifact@v4
        with:
          name: all-android-apks-${{ github.run_id }}
          path: app/src-tauri/gen/android/**/*.apk
          retention-days: 7

      - name: Find and Rename Primary APK (Best Guess)
        id: find_apk
        working-directory: app
        run: |
          echo "Searching for the best APK candidate..."
          
          # Try multiple strategies to find the right APK
          APK_PATH=""
          
          # Strategy 1: Look for release APK that's NOT unsigned
          APK_PATH=$(find src-tauri/gen/android -name "*release.apk" ! -name "*unsigned*" | head -1)
          
          # Strategy 2: If that fails, look for the largest APK (likely the signed one)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find src-tauri/gen/android -name "*.apk" -exec ls -la {} \; | sort -k5 -nr | head -1 | awk '{print $9}')
          fi
          
          # Strategy 3: If that fails, just take any APK
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find src-tauri/gen/android -name "*.apk" | head -1)
          fi
          
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          
          echo "Selected APK: $APK_PATH"
          
          SANITIZED_APP_NAME=$(echo "${{ inputs.app_name }}" | sed 's/[^a-zA-Z0-9._-]//g')
          COMMIT_HASH=$(git rev-parse --short HEAD)
          NEW_NAME="${SANITIZED_APP_NAME}-${COMMIT_HASH}.apk"
          
          echo "Copying '$APK_PATH' to '$NEW_NAME'"
          cp "$APK_PATH" "$NEW_NAME"
          
          echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT
          
      - name: Upload Primary APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: primary-android-apk-${{ github.run_id }}
          path: app/${{ steps.find_apk.outputs.apk_path }}
          retention-days: 7

      - name: Upload debug info on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-debug-info-${{ github.run_id }}
          path: |
            app/src-tauri/gen/android/app/build/outputs/logs/
            app/src-tauri/target/
            app/src-tauri/gen/android/keystore.properties
          retention-days: 1
