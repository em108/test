# Alternative: Use the exact Readest approach
name: Build Android App (Readest Method)

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository to clone and build'
        type: string
        required: true
      ref:
        description: 'Branch, tag, or ref to build'
        type: string
        default: main
      app_name:
        description: 'App name for the Android build'
        type: string
        default: "MyApp"

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.WF_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.0.11902837"

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Build frontend
        run: |
          if [ -f package.json ] && grep -q '"build"' package.json; then
              npm run build
          else
              echo "No build script found, trying vite build directly"
              npx vite build
          fi

      - name: Build and sign Android APK (Readest method)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.11902837
        run: |
          # Remove any existing Android build
          rm -rf src-tauri/gen/android
          
          # Initialize Android project
          npx tauri android init
          
          # Configure signing exactly like Readest
          cd src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEYSTORE_B64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
          
          cd ../../..
          
          # Build APK - this should produce signed APK
          npx tauri android build
          
          # Check what was created
          echo "=== APK FILES CREATED ==="
          find src-tauri/gen/android -name "*.apk" -type f
          
          # Copy the APK with a better name
          apk_path="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          if [ -f "${apk_path}/app-universal-release.apk" ]; then
            cp "${apk_path}/app-universal-release.apk" "${{ inputs.app_name }}_signed.apk"
            echo "✅ Found signed APK: app-universal-release.apk"
          else
            echo "❌ No signed APK found at expected location"
            ls -la "${apk_path}/"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_id }}
          path: "${{ inputs.app_name }}_signed.apk"
          retention-days: 7
