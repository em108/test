name: Build Vite App for Android Gemini 2

on:
  workflow_call:
    inputs:
      repository:
        description: Repository to clone and build
        type: string
        required: true
      ref:
        description: Branch/tag/ref to build
        type: string
        required: true
      app_name:
        description: App name for the Android build
        type: string
        default: "MyApp"
      bundle_id:
        description: Bundle identifier (e.g., com.example.myapp)
        type: string
        default: "com.example.myapp"
    secrets:
      WF_TOKEN:
        description: GitHub token for private repos
        required: false
      # Secrets that the calling workflow must provide
      ANDROID_KEYSTORE_B64:
        description: 'Base64 encoded content of the release keystore file.'
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        description: 'The password for the release keystore.'
        required: true
      ANDROID_KEY_ALIAS:
        description: 'The alias of the key in the keystore.'
        required: true
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to clone and build
        type: string
        required: true
      ref:
        description: Branch/tag/ref to build
        type: string
        default: main
      app_name:
        description: App name for the Android build
        type: string
        default: "MyApp"
      bundle_id:
        description: Bundle identifier (e.g., com.example.myapp)
        type: string
        default: "com.example.myapp"

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout self
        uses: actions/checkout@v4

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.WF_TOKEN || github.token }}
          path: app

      # ... (all setup steps remain the same) ...

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components and set NDK_HOME
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;33.0.0" "ndk;25.2.9519653"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV
        
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        working-directory: app
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi

      # ... (Tauri init and config steps remain the same) ...
      
      - name: Update Tauri configuration and package.json
        working-directory: app
        run: |
          npm pkg set "scripts.tauri"="tauri"
          sudo apt-get update && sudo apt-get install -y jq
          jq '
            .identifier = "${{ inputs.bundle_id }}" |
            .productName = "${{ inputs.app_name }}" |
            .build.frontendDist = "../dist" |
            .tauri.android.minSdkVersion = 24 |
            .tauri.android.targetSdkVersion = 33
          ' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          CARGO_PKG_NAME=$(echo "${{ inputs.app_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          sed -i 's/^name = .*/name = "'"$CARGO_PKG_NAME"'"/' src-tauri/Cargo.toml
          
      - name: Build frontend
        working-directory: app
        run: npm run build

      # ===== START: NEW PRODUCTION SIGNING AND BUILD STEP =====
      - name: Build Signed Android APK using Secrets
        working-directory: app
        # Use the secrets we created to set environment variables for Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} # Use the same for key if they match
        run: |
          # Decode the Base64 secret back into the keystore file
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > release.keystore
          
          # Set the environment variables pointing to our decoded key and alias
          export TAURI_SIGNING_PRIVATE_KEY_PATH="./release.keystore"
          export TAURI_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"

          # Initialize and build a signed release APK
          # The --release flag is crucial
          npx tauri android init
          npx tauri android build --apk --release
      # ===== END: NEW PRODUCTION SIGNING AND BUILD STEP =====

      - name: Find and Rename APK
        id: find_apk
        working-directory: app
        run: |
          APK_PATH=$(find src-tauri/gen/android -name "*-release-unsigned-signed.apk" -o -name "*-release-signed.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found!" && exit 1
          fi
          SANITIZED_APP_NAME=$(echo "${{ inputs.app_name }}" | sed 's/[^a-zA-Z0-9._-]//g')
          COMMIT_HASH=$(git rev-parse --short HEAD)
          NEW_NAME="${SANITIZED_APP_NAME}-${COMMIT_HASH}.apk"
          mv "$APK_PATH" "$NEW_NAME"
          echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "APK found and renamed to: $NEW_NAME"
          
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/${{ steps.find_apk.outputs.apk_path }}
          retention-days: 3

      - name: Upload debug info on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-debug-info
          path: |
            app/src-tauri/gen/android/app/build/outputs/logs/
            app/src-tauri/target/
          retention-days: 1
