# This workflow builds a Tauri v2 application for Android using a permanent, secure signing key.
name: Build Android App with Production Signing (Tauri v2 - Final)

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to clone and build (e.g., "my-org/my-app")'
        type: string
        required: true
      ref:
        description: 'Branch, tag, or ref to build (e.g., "main")'
        type: string
        required: true
      app_name:
        description: 'App name for the Android build (e.g., "MyApp")'
        type: string
        default: "MyApp"
      bundle_id:
        description: 'Bundle identifier (e.g., "com.example.myapp")'
        type: string
        default: "com.example.myapp"
    secrets:
      WF_TOKEN:
        description: 'GitHub token with access to private repositories, if needed.'
        required: false
      ANDROID_KEYSTORE_B64:
        description: 'Base64 encoded content of the release keystore file.'
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        description: 'The password for the release keystore.'
        required: true
      ANDROID_KEY_ALIAS:
        description: 'The alias of the key within the keystore.'
        required: true

  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository to clone and build (e.g., "my-org/my-app")'
        type: string
        required: true
      ref:
        description: 'Branch, tag, or ref to build (e.g., "main")'
        type: string
        default: main
      app_name:
        description: 'App name for the Android build (e.g., "MyApp")'
        type: string
        default: "MyApp"
      bundle_id:
        description: 'Bundle identifier (e.g., "com.example.myapp")'
        type: string
        default: "com.example.myapp"

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout self (workflow repository)
        uses: actions/checkout@v4

      - name: Checkout target repository (application code)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.WF_TOKEN || github.token }}
          path: app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Java (for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components and set NDK_HOME
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;33.0.0" "ndk;25.2.9519653"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV
        
      - name: Install Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        working-directory: app
        run: |
          if [ -f "package-lock.json" ]; then npm ci;
          elif [ -f "yarn.lock" ]; then yarn install --frozen-lockfile;
          elif [ -f "pnpm-lock.yaml" ]; then npm install -g pnpm && pnpm install --frozen-lockfile;
          elif [ -f "bun.lockb" ]; then npm install -g bun && bun install;
          else npm install; fi

      - name: Initialize Tauri if not present
        working-directory: app
        run: |
          if [ ! -f "src-tauri/tauri.conf.json" ]; then
            npm install --save-dev @tauri-apps/cli@latest @tauri-apps/api@latest
            npx tauri init --ci \
              --app-name "${{ inputs.app_name }}" \
              --window-title "${{ inputs.app_name }}" \
              --frontend-dist "dist" \
              --dev-url "http://localhost:5173"
          fi

      - name: Add tauri script to package.json
        working-directory: app
        run: npm pkg set "scripts.tauri"="tauri"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: Update Tauri configuration for Android (Tauri v2 Schema)
        working-directory: app
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          jq '
            .productName = "${{ inputs.app_name }}" |
            .identifier = "${{ inputs.bundle_id }}" |
            .build.frontendDist = "../dist" |
            .bundle.android.minSdkVersion = 24
          ' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          
          CARGO_PKG_NAME=$(echo "${{ inputs.app_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          sed -i 's/^name = .*/name = "'"$CARGO_PKG_NAME"'"/' src-tauri/Cargo.toml
          
      - name: Build frontend
        working-directory: app
        run: |
          if [ -f package.json ] && grep -q '"build"' package.json; then
              npm run build
          else
              echo "No build script found, trying vite build directly"
              npx vite build
          fi

      - name: Build and Sign Android APK using Secrets
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "Decoding keystore from secret..."
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > release.keystore
          
          export TAURI_SIGNING_PRIVATE_KEY_PATH="./release.keystore"
          export TAURI_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"

          npx tauri android init
          
          echo "Starting Tauri Android build..."
          # The --release flag is not needed for `tauri android build` in v2, as it's the default.
          npx tauri android build --apk

      - name: Find and Rename APK
        id: find_apk
        working-directory: app
        run: |
          echo "Searching for signed release APK..."
          APK_PATH=$(find src-tauri/gen/android -name "*-release-unsigned-signed.apk" -o -name "*-release-signed.apk" | head -1)
          
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Signed release APK not found!"
            echo "Dumping directory structure for debugging:"
            ls -laR src-tauri/gen/android
            exit 1
          fi
          
          SANITIZED_APP_NAME=$(echo "${{ inputs.app_name }}" | sed 's/[^a-zA-Z0-9._-]//g')
          COMMIT_HASH=$(git rev-parse --short HEAD)
          NEW_NAME="${SANITIZED_APP_NAME}-${COMMIT_HASH}.apk"
          
          echo "Moving '$APK_PATH' to '$NEW_NAME'"
          mv "$APK_PATH" "$NEW_NAME"
          
          echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT
          
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_id }}
          path: app/${{ steps.find_apk.outputs.apk_path }}
          retention-days: 7

      - name: Upload debug info on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-debug-info-${{ github.run_id }}
          path: |
            app/src-tauri/gen/android/app/build/outputs/logs/
            app/src-tauri/target/
          retention-days: 1
